<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TALLY — Factory Floor Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDE9DE;
    --panel:#FBF9F3;
    --panel-2:#F3EFE4;
    --ink:#221F1A;
    --ink-soft:#5C574C;
    --ink-faint:#8B8577;
    --line:#D9D2C0;
    --line-strong:#C4BCA5;
    --indigo:#2E4374;
    --indigo-dark:#1D2C50;
    --indigo-tint:#E4E9F2;
    --orange:#D9622B;
    --orange-dark:#A6491D;
    --orange-tint:#FBEADE;
    --green:#4B7A57;
    --green-tint:#E6EEE6;
    --red:#B8432A;
    --red-tint:#F6E4DD;
    --radius:6px;
    --shadow:0 1px 2px rgba(34,31,26,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{ font-family:'Oswald',sans-serif; letter-spacing:0.02em; text-transform:uppercase; font-weight:600; margin:0; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  a{color:var(--indigo);}
  button{ font-family:'Inter',sans-serif; cursor:pointer; }
  input,select,textarea{ font-family:'Inter',sans-serif; }
  ::selection{ background:var(--orange-tint); }

  /* ---------- App shell ---------- */
  #app{ min-height:100vh; }
  .container{ max-width:1180px; margin:0 auto; padding:0 24px; }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:4px; border:1px solid var(--line-strong);
    background:var(--panel); color:var(--ink); font-size:13.5px; font-weight:500;
    padding:9px 16px; transition:transform .08s ease, background .15s ease;
  }
  .btn:hover{ background:var(--panel-2); }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--indigo); border-color:var(--indigo); color:#fff; }
  .btn-primary:hover{ background:var(--indigo-dark); }
  .btn-accent{ background:var(--orange); border-color:var(--orange); color:#fff; }
  .btn-accent:hover{ background:var(--orange-dark); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); }
  .btn-ghost:hover{ background:var(--panel-2); }
  .btn-danger{ background:transparent; border-color:var(--red); color:var(--red); }
  .btn-danger:hover{ background:var(--red-tint); }
  .btn-sm{ padding:6px 10px; font-size:12.5px; }
  .btn-block{ width:100%; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  /* ---------- Inputs ---------- */
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; }
  .field input[type=text], .field input[type=number], .field input[type=password], .field textarea, .field select{
    border:1px solid var(--line-strong); border-radius:4px; padding:10px 12px; font-size:14.5px;
    background:#fff; color:var(--ink); width:100%;
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:2px solid var(--indigo); outline-offset:1px; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .help{ font-size:12px; color:var(--ink-faint); }
  .err{ font-size:12.5px; color:var(--red); font-weight:500; }

  /* ---------- Login screen ---------- */
  .login-wrap{ min-height:100vh; display:flex; }
  .login-brand{
    flex:1 1 44%; background:var(--indigo); color:#EDE9DE; padding:64px 56px;
    display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden;
  }
  .login-brand .mark{ display:flex; align-items:center; gap:12px; }
  .login-brand .mark svg{ width:34px; height:34px; }
  .login-brand .mark span{ font-size:22px; letter-spacing:0.08em; color:#fff; }
  .login-brand .tagline{ font-size:15px; color:#B9C4DE; max-width:360px; line-height:1.6; font-family:'Inter',sans-serif; text-transform:none; font-weight:400; letter-spacing:0; }
  .rack{ position:absolute; right:-40px; bottom:-30px; opacity:0.9; }
  .login-form-wrap{ flex:1 1 56%; display:flex; align-items:center; justify-content:center; padding:40px; background:var(--bg); }
  .login-card{ width:100%; max-width:380px; }
  .login-card h1{ font-size:26px; margin-bottom:6px; }
  .login-card .sub{ font-size:13.5px; color:var(--ink-soft); text-transform:none; font-family:'Inter',sans-serif; font-weight:400; letter-spacing:0; margin-bottom:28px; }
  .tab-toggle{ display:flex; gap:2px; background:var(--panel-2); border-radius:5px; padding:3px; margin-bottom:24px; }
  .tab-toggle button{ flex:1; background:transparent; border:none; padding:8px; border-radius:4px; font-size:13px; font-weight:600; color:var(--ink-soft); }
  .tab-toggle button.active{ background:#fff; color:var(--ink); box-shadow:var(--shadow); }

  /* ---------- Header / nav ---------- */
  .topbar{
    background:var(--panel); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .topbar-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 24px; gap:20px; }
  .brand-mini{ display:flex; align-items:center; gap:10px; }
  .brand-mini svg{ width:24px; height:24px; }
  .brand-mini span{ font-size:17px; letter-spacing:0.06em; }
  .nav-tabs{ display:flex; gap:4px; }
  .nav-tabs button{
    background:transparent; border:none; padding:8px 14px; border-radius:4px;
    font-size:13.5px; font-weight:600; color:var(--ink-soft); font-family:'Inter',sans-serif;
  }
  .nav-tabs button.active{ background:var(--indigo-tint); color:var(--indigo-dark); }
  .who{ display:flex; align-items:center; gap:12px; }
  .who .name{ font-size:13.5px; font-weight:600; }
  .who .role{ font-size:11px; color:var(--ink-faint); }

  /* ---------- Page ---------- */
  .page{ padding:32px 0 64px; }
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:24px; gap:16px; flex-wrap:wrap; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--orange-dark); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:6px; }
  .page-title{ font-size:28px; }
  .page-desc{ font-size:13.5px; color:var(--ink-soft); margin-top:6px; font-family:'Inter',sans-serif; text-transform:none; font-weight:400; letter-spacing:0; }

  /* ---------- Panels ---------- */
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:20px; }
  .panel-title{ font-size:14px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; }
  .grid-2{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start; }
  @media (max-width:900px){ .grid-2{ grid-template-columns:1fr; } }

  /* ---------- Stat cards ---------- */
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  @media (max-width:700px){ .stat-row{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; }
  .stat-card .num{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; }
  .stat-card .lbl{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px; }
  .stat-card.up .num{ color:var(--green); }
  .stat-card.down .num{ color:var(--red); }
  .stat-card.accent .num{ color:var(--orange-dark); }

  /* ---------- Sign-in sheet ---------- */
  .sheet-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .sheet-row:last-child{ border-bottom:none; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--indigo); flex:none; }
  .sheet-row .who-name{ font-weight:600; flex:1; }
  .sheet-row .who-time{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); }
  .empty-note{ font-size:13px; color:var(--ink-faint); padding:10px 0; }

  /* ---------- Activity feed ---------- */
  .feed-row{ display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .feed-row:last-child{ border-bottom:none; }
  .feed-icon{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; }
  .feed-icon.add{ background:var(--green-tint); color:var(--green); }
  .feed-icon.rem{ background:var(--red-tint); color:var(--red); }
  .feed-icon.new{ background:var(--indigo-tint); color:var(--indigo); }
  .feed-icon.del{ background:var(--panel-2); color:var(--ink-faint); }
  .feed-text{ font-size:13px; line-height:1.5; }
  .feed-text b{ font-weight:600; }
  .feed-meta{ font-size:11.5px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; margin-top:2px; }

  /* ---------- Inventory toolbar ---------- */
  .inv-toolbar{ display:flex; gap:12px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
  .search-wrap{ position:relative; flex:1; min-width:220px; }
  .search-wrap input{ width:100%; padding:10px 12px 10px 34px; border:1px solid var(--line-strong); border-radius:4px; font-size:14px; background:#fff; }
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-faint); }
  .toggle-chip{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--ink-soft); border:1px solid var(--line-strong); border-radius:20px; padding:7px 14px; background:#fff; }
  .toggle-chip input{ accent-color:var(--orange); }

  /* ---------- Tag card grid ---------- */
  .tag-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
  .tag-card{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:16px 14px 14px 14px; position:relative; display:flex; flex-direction:column; gap:10px;
    border-top:2px dashed var(--line-strong);
  }
  .tag-hole{ position:absolute; top:-8px; left:16px; width:16px; height:16px; border-radius:50%; background:var(--bg); border:2px solid var(--line-strong); }
  .tag-photo{ width:100%; aspect-ratio:4/3; border-radius:4px; background:var(--panel-2); overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .tag-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .tag-photo .ph-icon{ color:var(--ink-faint); }
  .tag-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .tag-name{ font-size:15px; font-weight:600; line-height:1.3; font-family:'Inter',sans-serif; text-transform:none; letter-spacing:0; }
  .swatch-row{ display:flex; align-items:center; gap:8px; }
  .swatch{ width:16px; height:16px; border-radius:3px; border:1px solid rgba(0,0,0,0.15); flex:none; }
  .code-txt{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); }
  .tag-desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .qty-row{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
  .qty-badge{ font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; }
  .low-flag{ font-size:10.5px; font-weight:700; background:var(--orange-tint); color:var(--orange-dark); padding:3px 7px; border-radius:3px; text-transform:uppercase; letter-spacing:0.04em; }
  .tag-actions{ display:flex; gap:6px; margin-top:4px; }
  .tag-actions .btn{ flex:1; padding:7px; font-size:12px; }

  /* ---------- Modal ---------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(24,21,16,0.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100; }
  .modal{ background:var(--panel); border-radius:8px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:26px; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .modal-head h2{ font-size:19px; }
  .close-x{ background:transparent; border:none; font-size:20px; color:var(--ink-faint); line-height:1; padding:4px; }
  .photo-input-wrap{ display:flex; align-items:center; gap:14px; }
  .photo-preview{ width:74px; height:74px; border-radius:6px; background:var(--panel-2); overflow:hidden; flex:none; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); }
  .photo-preview img{ width:100%; height:100%; object-fit:cover; }
  .color-input-wrap{ display:flex; gap:10px; align-items:center; }
  .color-input-wrap input[type=color]{ width:44px; height:38px; border:1px solid var(--line-strong); border-radius:4px; padding:2px; background:#fff; }

  /* ---------- Toast ---------- */
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 20px; border-radius:6px; font-size:13.5px; z-index:200; box-shadow:0 4px 14px rgba(0,0,0,0.2); }
  .toast.error{ background:var(--red); }
  .toast.success{ background:var(--green); }

  /* ---------- Detail expand ---------- */
  .detail-photo{ width:100%; max-height:220px; object-fit:cover; border-radius:6px; margin-bottom:14px; background:var(--panel-2); }
  .detail-desc{ font-size:14px; line-height:1.65; color:var(--ink); white-space:pre-wrap; }
  .kv-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .kv-row:last-child{ border-bottom:none; }
  .kv-row .k{ color:var(--ink-soft); }
  .kv-row .v{ font-weight:600; font-family:'IBM Plex Mono',monospace; }
  .stock-adjust{ display:flex; gap:8px; align-items:center; margin-top:16px; }
  .stock-adjust input{ width:70px; text-align:center; border:1px solid var(--line-strong); border-radius:4px; padding:9px; font-size:14px; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-faint); }
  .empty-state svg{ margin-bottom:14px; opacity:0.5; }
  .empty-state p{ font-size:14px; }

  /* ================= REPORT TABLE ================= */

.report-table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    background:#fff;
}

.report-table th{
    background:#2E4374;
    color:#fff;
    padding:12px;
    text-align:left;
    font-size:14px;
}

.report-table td{
    padding:12px;
    border-bottom:1px solid #ddd;
    font-size:14px;
}

.report-table tr:nth-child(even){
    background:#f8f8f8;
}

.report-table tr:hover{
    background:#eef4ff;
}
</style>

<body>
<div id="app"></div>

<script>
/* ============================= STORAGE HELPERS ============================= */
const SHARED = true;

function storeGet(key, fallback){
  return new Promise(resolve => {
    if(window.storage && typeof window.storage.get === 'function'){
      window.storage.get(key, SHARED).then(r => {
        if(!r) return resolve(fallback);
        try{ resolve(JSON.parse(r.value)); }
        catch(err){ resolve(fallback); }
      }).catch(() => resolve(fallback));
    }else{
      try{
        const raw = localStorage.getItem('tally_' + key);
        resolve(raw ? JSON.parse(raw) : fallback);
      }catch(err){ resolve(fallback); }
    }
  });
}
function storeSet(key, value){
  return new Promise(resolve => {
    const finish = ok => resolve(ok);
    if(window.storage && typeof window.storage.set === 'function'){
      window.storage.set(key, JSON.stringify(value), SHARED)
        .then(() => finish(true))
        .catch(e => { console.error('storage set failed', e); finish(false); });
    }else{
      try{
        localStorage.setItem('tally_' + key, JSON.stringify(value));
        finish(true);
      }catch(e){ console.error('storage set failed', e); finish(false); }
    }
  });
}

/* ============================= ADMIN CONFIG ============================= */
const ADMIN_USERNAME = 'admin';
const ADMIN_PASSWORD = '2871';

/* ============================= STATE ============================= */
const State = {
  loading: true,
  currentUser: null,
  currentRole: null,   // 'admin' | 'user'
  view: 'login',       // login | dashboard | inventory
  authMode: 'signin',  // signin (admin) | user
  showManageUsers: false,
  users: [],
  loginLog: [],
  items: [],
  activityLog: [],
  search: '',
  lowOnly: false,
  pendingPhoto: '',     // dataURL for form-in-progress
  editingItemId: null,  // when non-null, item detail/edit modal open
  showAddModal: false,
  toast: null
};

function uid(){
  return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
}
function nowISO(){ return new Date().toISOString(); }
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}
function isToday(iso){
  const d = new Date(iso);
  const t = new Date();
  return d.toDateString() === t.toDateString();
}
function showToast(msg, type){
  State.toast = { msg, type: type || 'default' };
  render();
  setTimeout(()=>{ State.toast = null; render(); }, 2600);
}
function esc(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

/* ============================= LOAD ============================= */
async function loadAll(){
let [users, loginLog, items, activityLog] = await Promise.all([
    storeGet('users', []),
    storeGet('login-log', []),
    storeGet('inventory-items', []),
    storeGet('activity-log', [])
  ]);
// If no admin exists yet, bootstrap a default admin or promote the first user
  const hasAdmin = users.some(u => u.role === 'admin');
  if(!hasAdmin){
    if(users.length === 0){
      // Fresh install: create default admin account
      users = [{ name: 'admin', pin: '2871', role: 'admin' }];
      await storeSet('users', users);
      State.users = users;
    }else{
      // Existing users without roles: promote the first user to admin
      users = users.map((u, i) => i === 0 ? {...u, role: 'admin'} : {...u, role: 'user'});
      await storeSet('users', users);
      State.users = users;
    }
  }
  State.users = users;
  State.loginLog = loginLog;
  State.items = items;
  State.activityLog = activityLog;
  State.loading = false;
  render();
}

/* ============================= AUTH ============================= */
async function handleAuthSubmit(e){
  e.preventDefault();
  const form = e.target;
  const name = form.name.value.trim();
  const pin = form.pin.value.trim();
  const errEl = document.getElementById('auth-err');
  errEl.textContent = '';

  if(!name || !pin){
    errEl.textContent = 'Enter a name and a PIN.';
    return;
  }

  // Admin sign-in (fixed credentials)
  if(name.toLowerCase() === ADMIN_USERNAME.toLowerCase() && pin === ADMIN_PASSWORD){
    await completeLogin(ADMIN_USERNAME, 'admin');
    return;
  }

  // Regular user sign-in
  const user = State.users.find(u =>
    u.name.toLowerCase() === name.toLowerCase() &&
    u.name.toLowerCase() !== ADMIN_USERNAME.toLowerCase()
  );
  if(!user || user.pin !== pin){
    errEl.textContent = 'Name and PIN do not match our records.';
    return;
  }
  await completeLogin(user.name, user.role || 'user');
}

async function completeLogin(name, role){
  State.currentUser = name;
  State.currentRole = role;
  const entry = { name, role, timestamp: nowISO() };
  State.loginLog = [entry, ...State.loginLog].slice(0, 300);
  await storeSet('login-log', State.loginLog);
  State.view = 'dashboard';
  render();
}

function handleLogout(){
  State.currentUser = null;
  State.currentRole = null;
  State.showManageUsers = false;
  State.view = 'login';
  render();
}

/* ============================= INVENTORY ACTIONS ============================= */
async function persistItems(){ await storeSet('inventory-items', State.items); }
async function persistActivity(){ await storeSet('activity-log', State.activityLog); }

function pushActivity(entry){
  State.activityLog = [{...entry, id: uid(), timestamp: nowISO(), user: State.currentUser}, ...State.activityLog].slice(0, 400);
}

async function handleAddItemSubmit(e){
  e.preventDefault();
  const form = e.target;
  const name = form.iname.value.trim();
  const colorCode = form.icode.value.trim();
  const colorHex = form.ihex.value;
  const qty = parseInt(form.iqty.value, 10);
  const desc = form.idesc.value.trim();
  const errEl = document.getElementById('item-err');
  errEl.textContent = '';

  if(!name){ errEl.textContent = 'Give this garment a name.'; return; }
  if(isNaN(qty) || qty < 0){ errEl.textContent = 'Enter a valid starting quantity.'; return; }

  const item = {
    id: uid(),
    name, colorCode, colorHex,
    quantity: qty,
    description: desc,
    photo: State.pendingPhoto || '',
    createdAt: nowISO(),
    updatedAt: nowISO(),
    createdBy: State.currentUser
  };
  State.items = [item, ...State.items];
  pushActivity({ type:'created', itemId: item.id, itemName: item.name, colorCode: item.colorCode, qty });
  await Promise.all([persistItems(), persistActivity()]);
  State.showAddModal = false;
  State.pendingPhoto = '';
  showToast('Added ' + name + ' to inventory', 'success');
}

async function adjustStock(itemId, delta){
  const item = State.items.find(i => i.id === itemId);
  if(!item) return;
  const newQty = item.quantity + delta;
  if(newQty < 0){ showToast('Not enough stock to remove that many', 'error'); return; }
  item.quantity = newQty;
  item.updatedAt = nowISO();
  pushActivity({ type: delta >= 0 ? 'added' : 'removed', itemId: item.id, itemName: item.name, colorCode: item.colorCode, qty: Math.abs(delta) });
  await Promise.all([persistItems(), persistActivity()]);
  render();
}

async function deleteItem(itemId){
  const item = State.items.find(i => i.id === itemId);
  if(!item) return;
  if(!confirm('Remove "' + item.name + '" from the ledger for good?')) return;
  State.items = State.items.filter(i => i.id !== itemId);
  pushActivity({ type:'deleted', itemId: item.id, itemName: item.name, colorCode: item.colorCode, qty: item.quantity });
  await Promise.all([persistItems(), persistActivity()]);
  State.editingItemId = null;
  showToast('Removed ' + item.name, 'default');
}

/* ============================= PHOTO HANDLING ============================= */
function handlePhotoSelect(input, target){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 720;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.68);
      if(target === 'add'){ State.pendingPhoto = dataUrl; }
      renderPhotoPreview(target, dataUrl);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function renderPhotoPreview(target, dataUrl){
  const el = document.getElementById(target + '-photo-preview');
  if(el){ el.innerHTML = '<img src="' + dataUrl + '" alt="">'; }
}

/* ============================= COMPUTED ============================= */
function todaysLogins(){
  return State.loginLog.filter(l => isToday(l.timestamp));
}
function todaysActivity(){
  return State.activityLog.filter(a => isToday(a.timestamp));
}
function todaysStats(){
  const acts = todaysActivity();
  let added = 0, removed = 0, created = 0;
  acts.forEach(a=>{
    if(a.type === 'added') added += a.qty;
    else if(a.type === 'removed') removed += a.qty;
    else if(a.type === 'created') created += 1;
  });
  return { added, removed, created, net: added - removed };
}
function filteredItems(){
  let list = State.items;
  const q = State.search.trim().toLowerCase();
  if(q){
    list = list.filter(i =>
      i.name.toLowerCase().includes(q) ||
      (i.colorCode || '').toLowerCase().includes(q) ||
      (i.description || '').toLowerCase().includes(q)
    );
  }
  if(State.lowOnly){ list = list.filter(i => i.quantity < 5); }
  return list;
}

function handleAddUser(e){
  e.preventDefault();
  const form = e.target;
  const name = form.newUserName.value.trim();
  const pin = form.newUserPin.value.trim();
  const errEl = document.getElementById('add-user-err');
  errEl.textContent = '';

  if(!name){ errEl.textContent = 'Enter the new user\'s name.'; return; }
  if(name.toLowerCase() === ADMIN_USERNAME.toLowerCase()){ errEl.textContent = 'That is the reserved admin name.'; return; }
  if(pin.length < 4){ errEl.textContent = 'PIN should be at least 4 characters.'; return; }
  const exists = State.users.some(u => u.name.toLowerCase() === name.toLowerCase());
  if(exists){ errEl.textContent = 'A user with that name already exists.'; return; }

  const newUser = { name, pin, role: 'user' };
  State.users = [...State.users, newUser];
  storeSet('users', State.users).then(ok => {
    if(!ok){ errEl.textContent = 'Could not save account. Try again.'; return; }
    showToast('Created account for ' + name, 'success');
  });
}

async function handleRemoveUser(name){
  const target = State.users.find(u => u.name === name);
  if(!target) return;
  if((target.role === 'admin') || name.toLowerCase() === ADMIN_USERNAME.toLowerCase()){
    showToast('The manager account cannot be removed.', 'error');
    return;
  }
  if(!confirm('Remove the account for "' + name + '"? They will no longer be able to sign in.')) return;
  State.users = State.users.filter(u => u.name !== name);
  await storeSet('users', State.users);
  showToast('Removed ' + name, 'default');
}

<thead>

<tr>

<th>Date</th>

<th>Employee</th>

<th>Action</th>

<th>Garment</th>

<th>Quantity</th>

<th>Delete</th>

</tr>

</thead>

<tbody id="reportBody">

${rows}

</tbody>

</table>

</div>

`;

}
async function deleteReport(index){

if(!confirm("Delete this report?")) return;

State.activityLog.splice(index,1);

await persistActivity();

render();

showToast("Report deleted","success");

}
/* ============================= EVENT WIRING ============================= */
function attachGlobalEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{ State.view = el.getAttribute('data-nav'); render(); });
  });
const logoutBtn = document.querySelector('[data-logout]');
  if(logoutBtn) logoutBtn.addEventListener('click', handleLogout);

  const addUserForm = document.getElementById('add-user-form');
  if(addUserForm) addUserForm.addEventListener('submit', handleAddUser);
  document.querySelectorAll('[data-remove-user]').forEach(el=>{
    el.addEventListener('click', ()=> handleRemoveUser(el.getAttribute('data-remove-user')));
  });

  const openAdd = document.querySelector('[data-open-add]');
  if(openAdd) openAdd.addEventListener('click', ()=>{ State.pendingPhoto=''; State.showAddModal = true; render(); });

  document.querySelectorAll('[data-close-add]').forEach(el=>{
    el.addEventListener('click', (e)=>{ if(e.target === el){ State.showAddModal = false; render(); } });
  });
  document.querySelectorAll('[data-close-detail]').forEach(el=>{
    el.addEventListener('click', (e)=>{ if(e.target === el){ State.editingItemId = null; render(); } });
  });
  document.querySelectorAll('[data-stop]').forEach(el=>{
    el.addEventListener('click', (e)=> e.stopPropagation());
  });

  const addForm = document.getElementById('add-item-form');
  if(addForm) addForm.addEventListener('submit', handleAddItemSubmit);
  const addPhotoInput = document.getElementById('add-photo-input');
  if(addPhotoInput) addPhotoInput.addEventListener('change', (e)=> handlePhotoSelect(e.target, 'add'));

  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{
      State.search = e.target.value;
      const focusVal = e.target.value;
      render();
      const el = document.getElementById('search-input');
      if(el){ el.focus(); el.value = focusVal; el.setSelectionRange(focusVal.length, focusVal.length); }
    });
  }
  const lowToggle = document.getElementById('low-toggle');
  if(lowToggle) lowToggle.addEventListener('change', (e)=>{ State.lowOnly = e.target.checked; render(); });

  document.querySelectorAll('[data-open-item]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-stock-minus],[data-stock-plus]')) return;
      State.editingItemId = el.getAttribute('data-open-item');
      render();
    });
  });

  document.querySelectorAll('[data-stock-plus]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-stock-plus');
      const amtEl = document.getElementById('detail-adjust-amt');
      const amt = (State.editingItemId === id && amtEl) ? (parseInt(amtEl.value,10) || 1) : 1;
      adjustStock(id, amt);
    });
  });
  document.querySelectorAll('[data-stock-minus]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-stock-minus');
      const amtEl = document.getElementById('detail-adjust-amt');
      const amt = (State.editingItemId === id && amtEl) ? (parseInt(amtEl.value,10) || 1) : 1;
      adjustStock(id, -amt);
    });
  });
  document.querySelectorAll('[data-delete-item]').forEach(el=>{
    el.addEventListener('click', ()=> deleteItem(el.getAttribute('data-delete-item')));
  });
  const reportSearch=document.getElementById("reportSearch");

if(reportSearch){

reportSearch.addEventListener("keyup",function(){

let value=this.value.toLowerCase();

document.querySelectorAll("#reportBody tr").forEach(row=>{

row.style.display=row.innerText.toLowerCase().includes(value)
?"":"none";

});

});

}
const csvBtn=document.getElementById("exportCSV");

if(csvBtn){

csvBtn.addEventListener("click",()=>{

let csv="Date,Employee,Action,Garment,Quantity\n";

State.activityLog.forEach(r=>{

csv+=`"${fmtTime(r.timestamp)}","${r.user}","${r.type}","${r.itemName}","${r.qty}"\n`;

});

const blob=new Blob([csv],{type:"text/csv"});

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download="Factory_Report.csv";

a.click();

URL.revokeObjectURL(url);

});

}
const pdfBtn=document.getElementById("exportPDF");

if(pdfBtn){

pdfBtn.addEventListener("click",()=>{

const {jsPDF}=window.jspdf;

const doc=new jsPDF();

doc.setFontSize(18);

doc.text("Ace Garment Nepal",20,20);

doc.setFontSize(12);

let y=35;

State.activityLog.forEach(r=>{

doc.text(

`${fmtTime(r.timestamp)} | ${r.user} | ${r.type} | ${r.itemName} | ${r.qty}`,

20,

y

);

y+=8;

if(y>280){

doc.addPage();

y=20;

}

});

doc.save("Factory_Report.pdf");

});

}
document.querySelectorAll("[data-delete-report]").forEach(btn=>{

btn.addEventListener("click",()=>{

deleteReport(
Number(btn.dataset.deleteReport)
);

});

});
}

loadAll();
</script>
</body>
</html>
